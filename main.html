<div class="wrapper">
        <div class="player">
            <video class="viewer" width="765" height="430" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
        
            <div class="controls">
                <!-- Play / Pause -->
                <button class="player__button toggle" title="Toggle Play">►</button>
        
                <!-- Volume -->
                <label>Volume
                    <input type="range" name="volume" class="volume" min="0" max="1" step="0.05" value="1">
                </label>
        
                <!-- Playback Speed -->
                <label>Speed
                    <input type="range" name="playbackSpeed" class="playbackSpeed" min="0.5" max="2" step="0.1" value="1">
                </label>
        
                <!-- Skip buttons -->
                <button data-skip="-10">« 10s</button>
                <button data-skip="25">25s »</button>
        
                <!-- Progress bar -->
                <div class="progress">
                    <div class="progress__filled"></div>
                </div>
            </div>
        </div>
    </div>
<script  src="./script.js">

</body>
</html>
